[package]
name = "pqsub-cli"
description = "Reference CLI and multi-agent simulation for pqsub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pqsub_cli"
path = "src/lib.rs"

[[bin]]
name = "pqsub"
path = "src/main.rs"

[dependencies]
pqsub-core = { path = "../pqsub-core" }
clap.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pqsub-verify = { path = "../pqsub-verify" }
