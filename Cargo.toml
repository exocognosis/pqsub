[workspace]
resolver = "2"
members = ["crates/pqsub-core", "crates/pqsub-cli", "crates/pqsub-verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc", "zeroize"] }
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65"] }
sha3 = "0.10.8"
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.3"
thiserror = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# ML-DSA is unusably slow unoptimized; keep deps optimized even in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
